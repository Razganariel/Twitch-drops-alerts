services:
  postgres:
    container_name: twitch-drops-postgres
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: PLACE_HOLDER
      POSTGRES_PASSWORD: PLACE_HOLDER
      POSTGRES_DB: PLACE_HOLDER
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U PLACE_HOLDER -d PLACE_HOLDER"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  redis:
    container_name: twitch-drops-redis
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 128m

  app:
    container_name: twitch-drops-alerts
    build:
      context: .
      target: app-runner
    ports:
      - "3330:3330"
    environment:
      - PORT=3330
      - DATABASE_URL=postgresql://twitchdrops:twitchdrops@postgres:5432/twitch-drops-alerts?schema=public
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    mem_limit: 256m

  worker:
    container_name: twitch-drops-worker
    build:
      context: .
      target: worker-runner
    environment:
      - DATABASE_URL=postgresql://twitchdrops:twitchdrops@postgres:5432/twitch-drops-alerts?schema=public
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    mem_limit: 256m
